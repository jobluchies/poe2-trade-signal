name: fetch-and-report

# Hourly snapshot of poe.ninja. The accumulating SQLite DB + generated report live
# on the `data` branch, NOT on main — main stays code-only so human code pushes
# never collide with the bot's hourly snapshot commits. The dashboard is published
# to GitHub Pages from the artifact this job uploads (not from a branch).
#
# poe.ninja is behind Cloudflare, so the fetcher drives headless Chromium
# (Playwright). Cloudflare MAY challenge GitHub's datacenter IPs even though it
# passes from a home IP — use the manual "Run workflow" button (workflow_dispatch)
# to test before trusting the schedule.

on:
  schedule:
    - cron: "5 * * * *"      # :05 past the hour (UTC) — off the contended :00 slot,
                             # where GitHub drops far more scheduled runs. Any cron
                             # delay should still land within the same hour, so the
                             # hour-floored bucket still fills.
  workflow_dispatch: {}        # manual trigger for testing

permissions:
  contents: write              # commit the updated DB + report to the data branch
  pages: write                 # publish the dashboard
  id-token: write              # required by deploy-pages

# Never let two scheduled runs publish on top of each other.
concurrency:
  group: fetch-and-report
  cancel-in-progress: false

env:
  DATA_BRANCH: data

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0          # full history so worktree/rebase have a merge base

      - name: Restore accumulated DB from the data branch
        # The time-series DB accumulates across runs and lives on `data`. Pull just
        # the DB into this code checkout so `cli.py fetch` appends onto real history
        # instead of a blank DB. (output/ is fully regenerated, so it needn't restore.)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin "$DATA_BRANCH" || true
          if git rev-parse --verify "origin/$DATA_BRANCH" >/dev/null 2>&1; then
            git checkout "origin/$DATA_BRANCH" -- data/poe2_signal.db || true
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies + Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Fetch snapshot (currency + uniques)
        run: python cli.py fetch

      - name: Prune snapshot history
        # The DB is append-only (one row per entity per hour, forever) with no
        # retention until now, so it grew to 100.29MB and every push since has been
        # hard-rejected by GitHub's 100MB single-file limit (GH001) — the retry loop
        # below used to mistake that rejection for a non-fast-forward race and burn
        # 3 attempts re-pushing the same oversized file. keep-days=14 is 2x the
        # longest lookback any report window uses (movers --window 1w = 7 days).
        run: python cli.py prune --keep-days 14

      - name: Regenerate report + dashboard
        run: |
          python cli.py report
          cp output/dashboard.html output/index.html   # Pages root -> dashboard

      - name: Publish DB + report to the data branch
        # `data` holds latest-snapshot-only, not a growing archive: every run commits
        # a single orphan commit and force-pushes it. Previously each run added a new
        # commit on top of the last (full binary DB blob every time, no delta
        # compression), which had ballooned the branch's reachable history to ~14GB
        # and was the underlying cause of the DB itself crossing the 100MB cap above.
        # An orphan commit means there's nothing to be non-fast-forward against, so
        # the old multi-attempt retry (which was retrying an unrelated rejection
        # reason identically 3 times) is no longer needed.
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          rm -rf ../data-branch
          git worktree prune
          git worktree add --orphan -B "$DATA_BRANCH" ../data-branch
          mkdir -p ../data-branch/data ../data-branch/output
          cp data/poe2_signal.db ../data-branch/data/
          cp -r output/. ../data-branch/output/
          git -C ../data-branch add data/ output/
          git -C ../data-branch commit -m "data: snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git -C ../data-branch push --force origin "$DATA_BRANCH"

      - name: Upload dashboard as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

  deploy:
    needs: fetch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
